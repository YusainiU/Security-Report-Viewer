[package]
name = "security-report-viewer"
version = "0.2.0"
edition = "2021"
[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

serde_json = "1"
